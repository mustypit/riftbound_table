# Tests (with screenshots), then native installers for Windows, macOS and Linux, uploaded as artifacts;
# on every push to main they are also published as a GitHub release (v1.0.<run number>).
name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew test --no-daemon
      - name: Screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-and-report
          path: |
            build/screenshots
            build/reports/tests/test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageMsi packageExe
            files: build/compose/binaries/main/*/*
            name: windows
          - os: macos-latest
            task: packageDmg
            files: build/compose/binaries/main/dmg/*.dmg
            name: macos
          - os: ubuntu-latest
            task: packageDeb
            files: build/compose/binaries/main/deb/*.deb
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Package
        run: ./gradlew ${{ matrix.task }} --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RiftboundTable-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Every push to main publishes a release with the installers (same version as packageVersion).
  release:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: RiftboundTable-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.${{ github.run_number }}
        run: |
          ls -la dist
          gh release create "$TAG" dist/* --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Riftbound Table $TAG" \
            --notes "Built from ${{ github.sha }}. Windows: .exe or .msi · macOS: .dmg (unsigned: right-click → Open the first time) · Linux: .deb" \
            --latest
