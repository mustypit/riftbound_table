# Tests (with screenshots), then native installers for Windows, macOS and Linux, uploaded as artifacts.
name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew test --no-daemon
      - name: Screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-and-report
          path: |
            build/screenshots
            build/reports/tests/test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            task: packageMsi packageExe
            files: build/compose/binaries/main/*/*
            name: windows
          - os: macos-latest
            task: packageDmg
            files: build/compose/binaries/main/dmg/*.dmg
            name: macos
          - os: ubuntu-latest
            task: packageDeb
            files: build/compose/binaries/main/deb/*.deb
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Package
        run: ./gradlew ${{ matrix.task }} --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RiftboundTable-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
